{% extends "base.html" %}
{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date("%d %B %Y") }}
    {% if page.tags %}&middot;
    {% for tag in page.tags %}<a href="{{ tag.url }}">{{ tag.name }}</a>{% if not loop.last %}, {% endif %}{% endfor %}
    {% endif %}
  </p>
  {{ content }}
</article>
{% endblock %}
