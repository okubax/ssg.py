<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page and page.title %}{{ page.title | e }} &middot; {% endif %}{{ site.title | e }}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a class="logo" href="/">{{ site.title }}</a>
    <nav>
      {% for item in site.navigation %}<a href="{{ item.url }}">{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>&copy; {{ site.author }}</p>
  </footer>
</body>
</html>
